[project]
name = "astarte_message_hub_proto"
version = "0.10.1"
description = "Astarte message hub protocol buffers for Python"
readme = "README.md"
requires-python = ">=3.8"
license = "Apache-2.0"
authors = [{ name = "Simone Orru", email = "simone.orru@secomind.com" }]
dependencies = ["grpcio==1.85.1"]

[project.urls]
Source = "https://github.com/astarte-platform/astarte-message-hub-proto"

[project.optional-dependencies]
generation = ["grpcio-tools==1.85.1", "termcolor==3.1.0"]
static = ["black", "pylint", "termcolor"]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"
